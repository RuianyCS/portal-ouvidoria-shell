name: Portal - Healthcheck externo (backend)

on:
  schedule:
    - cron: '15 */3 * * *'   # a cada 3 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Verificar backend do Portal
        id: hc
        continue-on-error: true
        run: python3 scripts/healthcheck.py | tee /tmp/hc.out
      - name: Registrar historico
        run: |
          git config user.name "portal-health"
          git config user.email "portal-health@users.noreply.github.com"
          git add health/last.json health/history.jsonl
          git diff --cached --quiet || git commit -m "health: $(python3 -c "import json;print(json.load(open('health/last.json'))['status'])") $(date -u +%FT%TZ)"
          git push
      - name: Fallar se indisponivel
        if: steps.hc.outcome == 'failure'
        run: exit 1
