name: Portal público → GitHub Pages (bootstrap + gate)
on:
  push: {branches: [main]}
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: shell-pages, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Garantir bootstrap público na raiz (portal em /p/)
        run: |
          cp scripts/public_redirect/index.html index.html
          cp scripts/public_redirect/app.js app.js
      - name: Gate anti-secret
        run: python3 scripts/gate_check.py
      - name: Commitar se mudou
        run: |
          git config user.name "portal-shell-ci" && git config user.email "ci@users.noreply.github.com"
          git add index.html app.js
          git diff --cached --quiet && echo "sem mudanças" || (git commit -m "deploy: bootstrap publico [skip ci]" && git push)
